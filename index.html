<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consistency">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Consistency</title>
<style>
:root{--bg:#000;--card:#111;--line:#262626;--tx:#fff;--mu:#888;--ok:#2f8f63;--no:#a8484a;--pend:#1c1c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:56px 20px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:32px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.date{color:var(--mu);font-size:13px;margin-top:2px}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 16px;min-height:40px;transition:border-color .15s}
.btn:hover{border-color:#555}
.btn.pri{background:#fff;color:#000;border-color:#fff;font-weight:500}
.btn.pri:hover{background:#ddd}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;color:var(--mu)}
.btn.sm:hover{color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;margin-bottom:32px}
.sum div{padding:16px 18px;border-right:1px solid var(--line)}
.sum div:last-child{border:0}
.n{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.l{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.gname{font-size:17px;font-weight:500;background:none;border:0;padding:0;text-align:left;letter-spacing:-.01em}
.gname:hover{text-decoration:underline;text-underline-offset:4px}
.meta{color:var(--mu);font-size:13px;white-space:nowrap}
.meta b{color:#fff;font-weight:500}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:360px}
.wk span{color:var(--mu);font-size:11px;text-align:center;padding-bottom:2px}
.b{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--pend);padding:0;font-size:11px;color:var(--mu);display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.b.done{background:var(--ok);border-color:var(--ok);color:#fff}
.b.miss{background:var(--no);border-color:var(--no);color:#fff}
.b.off{background:transparent;border-color:#1a1a1a;color:#444;cursor:default}
.b.pre{border-color:transparent;background:transparent;color:#333;cursor:default}
.b.now{box-shadow:0 0 0 2px #000,0 0 0 3px #888}
.b:not(.off):not(.pre):hover{border-color:#777}
.b:focus-visible,.btn:focus-visible,.gname:focus-visible{outline:2px solid #fff;outline-offset:2px}
.empty{text-align:center;padding:96px 0;color:var(--mu)}
.empty p{margin:0 0 20px}
.back{background:none;border:0;color:var(--mu);padding:0;margin-bottom:28px;font-size:13px}
.back:hover{color:#fff}
.desc{color:var(--mu);margin:4px 0 0;max-width:60ch}
.acts{display:flex;gap:8px;margin:20px 0 28px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
.stats .n{font-size:20px}
.nav{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.nav h2{font-size:15px;font-weight:500;margin:0;min-width:130px;text-align:center}
.nav button{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;color:var(--mu)}
.nav button:hover{color:#fff;border-color:#555}
.sec{margin-bottom:44px}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 20px}
.year .wk,.year .grid{gap:3px;max-width:none}
.year .b{font-size:0;border-width:0;background:var(--pend)}
.year .b.done{background:var(--ok)}.year .b.miss{background:var(--no)}
.year .b.off,.year .b.pre{background:#0c0c0c}
.mt{font-size:12px;color:var(--mu);margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:400px}
.modal h3{margin:0 0 18px;font-size:17px;font-weight:600}
.modal label{display:block;color:var(--mu);font-size:12px;margin:14px 0 6px}
.modal input,.modal textarea{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;resize:none}
.modal input:focus,.modal textarea:focus{border-color:#777}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
@media(max-width:520px){#app{padding-top:36px}.sum div{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.ch{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='consistency.v1';
let S={goals:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!Array.isArray(S.goals))S={goals:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const dObj=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const dStr=d=>ds(d.getFullYear(),d.getMonth(),d.getDate());
const T=()=>dStr(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['M','T','W','T','F','S','S'];
const find=id=>S.goals.find(g=>g.id===id);

function stats(g){
  const t=T();let done=0,miss=0;
  for(const k in g.log){if(k>=g.start&&k<=t){if(g.log[k]===1)done++;else if(g.log[k]===2)miss++}}
  const n=done+miss;
  let streak=0;const c=dObj(t);
  if(g.log[t]!==1)c.setDate(c.getDate()-1);
  while(dStr(c)>=g.start&&g.log[dStr(c)]===1){streak++;c.setDate(c.getDate()-1)}
  return{done,miss,n,pct:n?Math.round(done/n*100)+'%':'–',streak}
}

function cal(g,y,m,num){
  const t=T(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  let h='<div class="wk">'+WD.map(w=>'<span>'+w+'</span>').join('')+'</div><div class="grid">';
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=ds(y,m,d),v=g.log[k];
    let c='b';
    if(k>t)c+=' off';else if(k<g.start)c+=' pre';
    if(v===1&&k<=t)c+=' done';else if(v===2&&k<=t)c+=' miss';
    if(k===t)c+=' now';
    const dis=k>t||k<g.start;
    h+='<button class="'+c+'"'+(dis?' disabled tabindex="-1"':' data-g="'+g.id+'" data-d="'+k+'"')+' aria-label="'+k+'">'+(num?d:'')+'</button>';
  }
  return h+'</div>';
}

let ym=null,yr=null,armed=false;

function dash(){
  const t=T(),act=S.goals.filter(g=>g.start<=t),dn=act.filter(g=>g.log[t]===1).length;
  const tp=act.length?Math.round(dn/act.length*100)+'%':'–';
  const now=new Date(),nd=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let h='<div class="top"><div><h1>Consistency</h1><div class="date">'+nd+'</div></div>'+(S.goals.length?'<button class="btn" data-act="new">+ Add goal</button>':'')+'</div>';
  if(!S.goals.length)return h+'<div class="empty"><p>Nothing tracked yet.</p><button class="btn pri" data-act="new">+ Create your first goal</button></div>';
  h+='<div class="sum"><div><div class="n">'+S.goals.length+'</div><div class="l">Goals tracked</div></div><div><div class="n">'+dn+'</div><div class="l">Completed today</div></div><div><div class="n">'+tp+'</div><div class="l">Today’s consistency</div></div></div>';
  for(const g of S.goals){
    const s=stats(g);
    h+='<div class="card"><div class="ch"><button class="gname" data-open="'+g.id+'">'+esc(g.name)+'</button><span class="meta"><b>'+s.pct+'</b> consistency &nbsp; <b>'+s.streak+'</b> day streak</span></div>'+cal(g,now.getFullYear(),now.getMonth(),true)+'</div>';
  }
  return h;
}

function detail(g){
  const now=new Date();
  if(!ym)ym={y:now.getFullYear(),m:now.getMonth()};
  if(!yr)yr=now.getFullYear();
  const s=stats(g);
  let h='<button class="back" data-act="back">← Consistency</button><h1>'+esc(g.name)+'</h1>'+(g.desc?'<p class="desc">'+esc(g.desc)+'</p>':'')+'<div class="date">Since '+dObj(g.start).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+'</div>';
  h+='<div class="acts"><button class="btn sm" data-act="edit">Rename or edit</button><button class="btn sm" data-act="del">'+(armed?'Confirm delete':'Delete')+'</button></div>';
  h+='<div class="stats"><div><div class="n">'+s.pct+'</div><div class="l">Consistency</div></div><div><div class="n">'+s.streak+'</div><div class="l">Current streak</div></div><div><div class="n">'+s.done+'</div><div class="l">Completed days</div></div><div><div class="n">'+s.miss+'</div><div class="l">Missed days</div></div></div>';
  h+='<div class="sec"><div class="nav"><button data-act="pm" aria-label="Previous month">‹</button><h2>'+MN[ym.m]+' '+ym.y+'</h2><button data-act="nm" aria-label="Next month">›</button></div>'+cal(g,ym.y,ym.m,true)+'</div>';
  h+='<div class="sec"><div class="nav"><button data-act="py" aria-label="Previous year">‹</button><h2>'+yr+'</h2><button data-act="ny" aria-label="Next year">›</button></div><div class="year">';
  for(let m=0;m<12;m++)h+='<div><div class="mt">'+MN[m].slice(0,3)+'</div>'+cal(g,yr,m,false)+'</div>';
  return h+'</div></div>';
}

function render(){
  const g=S.goals.find(x=>location.hash==='#g-'+x.id);
  document.getElementById('app').innerHTML=g?detail(g):dash();
  if(!g){ym=null;yr=null;armed=false}
}

function modal(g){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h3>'+(g?'Edit goal':'New goal')+'</h3><label for="mn">Goal name</label><input id="mn" maxlength="80" autocomplete="off" value="'+(g?esc(g.name):'')+'"><label for="md">Description (optional)</label><textarea id="md" rows="2" maxlength="200">'+(g?esc(g.desc||''):'')+'</textarea><label for="ms">Start date</label><input id="ms" type="date" value="'+(g?g.start:T())+'"><div class="mact"><button class="btn" data-m="x">Cancel</button><button class="btn pri" data-m="ok">'+(g?'Save':'Create goal')+'</button></div></div>';
  document.body.appendChild(o);
  const q=s=>o.querySelector(s),close=()=>o.remove();
  const ok=()=>{
    const name=q('#mn').value.trim();if(!name){q('#mn').focus();return}
    const start=q('#ms').value||T(),desc=q('#md').value.trim();
    if(g){g.name=name;g.desc=desc;g.start=start}
    else S.goals.push({id:Math.random().toString(36).slice(2,9),name,desc,start,log:{}});
    save();close();render();
  };
  o.addEventListener('click',e=>{const m=e.target.dataset.m;if(e.target===o||m==='x')close();else if(m==='ok')ok()});
  o.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();ok()}});
  q('#mn').focus();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]');
  if(b){const g=find(b.dataset.g);if(g){const k=b.dataset.d,v=((g.log[k]||0)+1)%3;if(v)g.log[k]=v;else delete g.log[k];save();render()}return}
  const op=e.target.closest('[data-open]');
  if(op){location.hash='g-'+op.dataset.open;return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const g=S.goals.find(x=>location.hash==='#g-'+x.id),k=a.dataset.act;
  if(k==='new')modal();
  else if(k==='back')location.hash='';
  else if(!g)return;
  else if(k==='edit')modal(g);
  else if(k==='del'){
    if(armed){S.goals=S.goals.filter(x=>x!==g);save();armed=false;location.hash=''}
    else{armed=true;render()}
  }
  else{
    if(k==='pm'){ym.m--;if(ym.m<0){ym.m=11;ym.y--}}
    if(k==='nm'){ym.m++;if(ym.m>11){ym.m=0;ym.y++}}
    if(k==='py')yr--;if(k==='ny')yr++;
    armed=false;render();
  }
});
window.addEventListener('hashchange',()=>{armed=false;render();window.scrollTo(0,0)});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
